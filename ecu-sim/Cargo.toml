[package]
name = "ecu-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
tower = "0.5"
socketcan = "3.6"
uds-transport = { path = "../uds-transport" }
